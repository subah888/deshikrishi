# Render.com blueprint: New + -> Blueprint -> pick this repo. Free plan is enough.
services:
  - type: web
    name: deshikrishi
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --workers 2 --timeout 60 --bind 0.0.0.0:$PORT
    healthCheckPath: /healthz
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
